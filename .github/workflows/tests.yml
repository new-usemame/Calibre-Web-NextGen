name: Test Suite — private gevent diagnostic
'on':
  workflow_dispatch: {}
concurrency:
  group: private-gevent-diagnostic-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  fast-tests:
    name: Original full Fast with private observer
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      CWNG_GEVENT_DIAGNOSTIC_DIR: ${{ runner.temp }}/cwng-gevent-diagnostic
    steps:
    - name: Checkout exact failed product846a
      uses: actions/checkout@v7
      with:
        ref: 846aa4b0e537e7cd9f1f8691547299f11a598dfa
        path: product
        fetch-depth: 0
        persist-credentials: false
    - name: Checkout separate diagnostic source
      uses: actions/checkout@v7
      with:
        ref: ${{ github.sha }}
        path: diagnostic
        persist-credentials: false
    - name: Remove Python bytecode and pycache
      run: 'echo "Removing any leftover .pyc and pycache"

        find . -name ''__pycache__'' -type d -print -exec rm -rf {} +

        find . -name ''*.pyc'' -type f -print -delete

        '
    - name: Set up Python 3.13
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'
        cache: pip
        cache-dependency-path: product/pyproject.toml
    - name: Set up Node 22
      uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: product/frontend/package-lock.json
    - name: Install frontend dependencies (npm ci)
      working-directory: product/frontend
      run: npm ci --prefer-offline --no-audit --no-fund --loglevel=error
    - name: Install system dependencies
      run: 'sudo apt-get update

        # lua5.4 runs the cwngsync KOReader plugin''s own test suites. They are

        # pure logic with no KOReader imports and had no CI runner until now,

        # so the plugin''s sync-safety logic was gated by nothing (#920).

        sudo apt-get install -y libldap2-dev libsasl2-dev libssl-dev gettext lua5.4

        '
    - name: Install dependencies
      run: 'python -m pip install --upgrade pip

        python -m pip install -e ''.[dev]''

        '
    - name: Create test environment structure
      run: 'sudo mkdir -p /config /books/import /books/ingest /config/processed_books

        sudo chmod -R 777 /config /books

        touch /config/epub-fixer.log

        touch /config/converter.log

        touch /config/cwa.db

        '
    - name: Freeze actual product/diagnostic runtime context
      run: 'python "$GITHUB_WORKSPACE/diagnostic/scripts/cwng_gevent_diagnostic_context.py"

        '
    - name: Run smoke and unit tests
      timeout-minutes: 15
      env:
        PYTHONPATH: ${{ github.workspace }}/product:${{ github.workspace }}/product/scripts:${{ github.workspace
          }}/diagnostic/scripts
      run: "set +e\n# --timeout=120 + --timeout-method=thread converts hung tests into named\n# test failures instead\
        \ of opaque step-level timeouts. Without\n# this, a stuck test on one xdist worker only manifests as a step\
        \ timeout\n# with no indication of which test or worker stalled.\n#\n# --dist=loadfile pins all tests in\
        \ a file to a single worker. This\n# eliminates the work-stealing race that's been hanging fast-tests\n\
        # runs (one of two parallel triggers stalls at ~9 minutes with no\n# currently-executing test for pytest-timeout\
        \ to interrupt). See\n# notes/xdist-worker-ipc-hang-followup-2026-05-21.md for diagnostic\n# log signature\
        \ + hypothesis. Fewer worker handoffs ≈ fewer races.\n#\n# faulthandler_timeout (INI option, set via -o\
        \ — there is no CLI\n# flag): last line of defense for whole-process freezes (e.g. the\n# GIL↔sqlite-mutex\
        \ AB-BA deadlock, see\n# notes/fix-udf-gil-deadlock-DESIGN.md). faulthandler's watchdog\n# writes every\
        \ thread's stack WITHOUT needing the GIL, so a freeze\n# that starves pytest-timeout still produces named\
        \ stacks in the\n# log instead of a silent step-timeout wall. 90 < the 120s\n# pytest-timeout on purpose:\
        \ a hung test logs stacks first, then\n# pytest-timeout attempts the interrupt.\npytest -m \"smoke or unit\"\
        \ \\\n  -n auto \\\n  --dist=loadfile \\\n  --maxfail=3 \\\n  -v \\\n  -rs \\\n  --tb=short \\\n  --timeout=120\
        \ \\\n  --timeout-method=thread \\\n  -o faulthandler_timeout=90 \\\n  --cov=cps \\\n  --cov-report=xml\
        \ \\\n  --cov-report=term-missing \\\n  -p cwng_gevent_diagnostic_observer\nresult=$?\nmkdir -p \"$CWNG_GEVENT_DIAGNOSTIC_DIR\"\
        \nprintf \"%s\\n\" \"$result\" > \"$CWNG_GEVENT_DIAGNOSTIC_DIR/original-full-pytest-exit.txt\"\nprintf \"\
        actual_exit=%s\\n\" \"$result\" >> \"$GITHUB_OUTPUT\"\nexit \"$result\"\n"
      id: original_full_fast
    - name: Run non-xdist unit tests (lane opt-outs)
      run: "pytest tests/unit -m \"integration\" \\\n  -v \\\n  -rs \\\n  --tb=short \\\n  --timeout=120 \\\n  --timeout-method=thread\n"
    - name: Real stdlib sensitivity control after full suite
      if: always()
      timeout-minutes: 2
      env:
        PYTHONPATH: ${{ github.workspace }}/product:${{ github.workspace }}/product/scripts
      run: python "$GITHUB_WORKSPACE/diagnostic/scripts/cwng_gevent_diagnostic_control_parent.py"
    - name: Record authoritative original outcome
      if: always()
      env:
        ORIGINAL_STEP_OUTCOME: ${{ steps.original_full_fast.outcome }}
        ORIGINAL_FULL_EXIT: ${{ steps.original_full_fast.outputs.actual_exit }}
      run: 'python - <<''PYCODE''

        import json,os

        from pathlib import Path

        p=Path(os.environ[''CWNG_GEVENT_DIAGNOSTIC_DIR'']);p.mkdir(parents=True,exist_ok=True)

        (p/''authoritative-original-outcome.json'').write_text(json.dumps({''step_outcome'':os.environ[''ORIGINAL_STEP_OUTCOME''],''full_pytest_exit'':os.environ[''ORIGINAL_FULL_EXIT'']
        or ''MISSING: abrupt loss/setup/step timeout'',''rule'':''Control/artifact steps never replace original
        full suite outcome''},indent=2))

        PYCODE

        '
    - name: Grade diagnostic evidence separately from original suite
      if: always()
      run: python "$GITHUB_WORKSPACE/diagnostic/scripts/cwng_gevent_diagnostic_validate.py"
    - name: Upload bounded diagnostic and partial worker evidence
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: gevent-full-fast-diagnostic-${{ github.sha }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/cwng-gevent-diagnostic/
        if-no-files-found: warn
        retention-days: 7
    permissions:
      contents: read
    defaults:
      run:
        working-directory: product
